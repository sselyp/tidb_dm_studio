name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Contract check
        run: |
          if [ -f scripts/ci/check_contract.py ]; then
            python3 scripts/ci/check_contract.py api/openapi.yaml
          else
            echo "scripts/ci/check_contract.py not present yet, skipping"
          fi
      - name: Generated constants up-to-date
        run: |
          if [ -f scripts/ci/gen_error_codes.py ]; then
            python3 scripts/ci/gen_error_codes.py
            git diff --exit-code
          else
            echo "scripts/ci/gen_error_codes.py not present yet, skipping"
          fi

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run lint
      - run: npm run build
