x-config-storage:
  mode: materialized
  description: >-
    保存即物化展开：写入时把全局默认与 source 级 override 合并为每个 source 的
    有效配置后落库；读取接口恒返回合并后的有效 per-source 配置，前端不做隐式合并。
    config hash（下发去重/幂等/审计 beforeHash）对落库的展开内容计算，语义等价的两套写法 hash 一致。
x-credential-handling:
  redline: D16
  rule: >-
    凭据零回显：代理层剥离/掩码 DM 原生响应中的一切上游口令，响应与日志一律不得出现。
    请求体中的口令字段仅作写入通道（writeOnly: true），任何读取模型不得回显。
  stripFromUpstreamResponses:
    - "target_config.password（DM v7.1.6 GET /api/v1/tasks 明文返回，代理必须先剥离）"
    - "source 口令（DM /api/v1/sources 即便掩码，也不得透传）"
  neverInResponses: [password, passwd, target_config.password]
  writeOnlyRequestFields: [LoginRequest.password, PasswordChangeRequest.oldPassword, PasswordChangeRequest.newPassword, DataSourceWrite.password]
x-dm-compat:
  dmVersion: 7.1.6
  downstreamTiDB: 7.1.9
  controlPlane:
    basePath: /api/v1
    docsEndpoint: /api/v1/docs
    enableFlag: "dm-master server_configs.master.openapi=true（未开启则 /api/v1/* 全部 404）"
    errorEnvelope: "{error_msg: string, error_code: int}；平台信封 code 由此适配，非透传"
  nativeStatusCodes:
    createSource: 201
    createTask: 201
    startTask: 200
    stopTask: 200
    updateTask: 200
    deleteSource: 204
    deleteTask: 204
  taskStageMapping:
    dmEnum: [Stopped, Running, Finished]
    platformState: [new, running, paused, stopped, finished, failed]
    downlink:
      running: start-task
      paused: pause-task
      stopped: stop-task
    uplink:
      Running: running
      Finished: finished
      Stopped: by-last-op-and-error
    derivation:
      - { platformState: new,      native: "无该任务", condition: "平台已建、从未下发" }
      - { platformState: running,  native: Running,   condition: "—" }
      - { platformState: finished, native: Finished,  condition: "—" }
      - { platformState: failed,   native: Stopped,   condition: "lastOp ∉ {pause,stop} 且 lastError != null" }
      - { platformState: paused,   native: Stopped,   condition: "lastOp == pause" }
      - { platformState: stopped,  native: Stopped,   condition: "lastOp == stop 或 lastOp 缺失 → 默认" }
    intentPriority: "人工意图优先：lastOp==stop|pause 先判，再看 lastError"
    lastOpPersistence: "lastOp 必须持久化（DB，非内存）；平台重启或任务由平台外创建 → lastOp 缺失 → 默认 stopped"
    notes: >-
      DM 无「暂停/停止」区分的 native stage：pause-task 与 stop-task 在 DM 侧最终均为 Stopped。
      故 paused/stopped 为**非对称映射、不合并**：下发用两条不同原生操作（pause-task / stop-task）
      并**持久化 lastOp**；上收在 DM Stopped 时按 last-op + lastError 唯一推导（见 derivation，
      人工意图优先），无法判定默认 stopped。failed 仅当 lastOp ∉ {pause,stop} 且 lastError != null
      （排除 stop 后残留 error 的误判）。平台 new = 已建未下发；finished = DM Finished 正常完成。
      DM TaskStage 大写、平台 state 小写；原生值同时经 TaskStatusData.stage / nativeState 透传供核对。
      x-dm-compat：paused/stopped 下发同 native Stopped，靠 last-op 消歧。
  precheck:
    restEndpoint: null
    mechanism: >-
      DM v7.1.6 不暴露 REST 预检端点。/task-precheck?level=connectivity 由后端复用 DM 检查项
      （与 dmctl check-task 同源）执行；跳过项经 TaskConfig.ignoreCheckItems 映射 DM ignore_checking_items。
      预检结果仅在 POST/PUT /api/v1/tasks 的 OperateTaskResponse.check_result 隐式返回。
    resultSemantics: "强制项不过 → error（不启动任务）；非强制项不过 → warning（仍启动）"
    ignoreItemIds: [dump_privilege, replication_privilege, version, server_id, binlog_enable,
                     table_schema, schema_of_shard_tables, auto_increment_ID, online_ddl,
                     empty_region, region_distribution, downstream_version, free_space,
                     downstream_mutex_features]
    extraIgnoreIdsFromErrorList: [all, binlog_format, binlog_row_image]
    errorCodes:
      configCheckItemNotSupport: 20001
      taskCheck: [26001, 26002, 26003, 26004, 26005, 26006, 26007]
    platformToDmItem:
      PRECHECK_TASK_NAME_DUP: "26001 ErrTaskCheckSameTableName / table_schema"
      PRECHECK_TABLE_CONFLICT: "26003 ErrTaskCheckGenTableRouter / table_schema"
      PRECHECK_PK_CONFLICT: auto_increment_ID
      PRECHECK_ROUTE_OVERLAP: "26003 gen table router（route 目标重叠）"
      PRECHECK_CHARSET_TZ_MISMATCH: "table_schema（不兼容字符集）"
  taskConverters: /api/v1/tasks/converters
  taskTemplates: /api/v1/tasks/templates
  listFilters: { withStatus: with_status, stage: stage, sourceNameList: source_name_list, enableRelay: enable_relay }
